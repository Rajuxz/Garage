{% extends 'vehicle/adminbase.html' %}
{% load static %}
{% block content %}



<head>
 
  <style type="text/css">
    a:link {
      text-decoration: none;
    }

    h6 {
      color: white;
      font-size: 0.90em;
    }

    .order-card {
      color: #fff;
    }

    .bg-c-blue {
      background: linear-gradient(45deg, #4099ff, #73b4ff);
    }

    .bg-c-green {
      background: linear-gradient(45deg, #2ed8b6, #59e0c5);
    }

    .bg-c-yellow {
      background: linear-gradient(45deg, #FFB64D, #ffcb80);
    }

    .bg-c-pink {
      background: linear-gradient(45deg, #FF5370, #ff869a);
    }


    .card {
      border-radius: 5px;
      -webkit-box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
      box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
      border: none;
      margin-bottom: 30px;
      -webkit-transition: all 0.3s ease-in-out;
      transition: all 0.3s ease-in-out;
    }

    .card .card-block {
      padding: 25px;
    }

    .order-card i {
      font-size: 26px;
    }

    .f-left {
      float: left;
    }

    .f-right {
      float: right;
    }
    h6{
      size:20;
    }
  </style>
</head>

<body>

  <br><br><br><br><br>
  <div style="margin-left:100px;" class="container">
    <div class="row">
      <div class="col-md-4 col-xl-3">
        <div class="card bg-c-blue order-card">
          <div class="card-block">
            <a href="/admin-view-customer">
              <h6 class="m-b-20">View All Customer</h6>
            </a>
            <h2 class="text-right"><i class="fas fa-eye f-left"></i></h2>
            <br>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-xl-3">
        <div class="card bg-c-green order-card">
          <div class="card-block">
            <a href="/admin-add-customer">
              <h6 class="m-b-20">Add Customer</h6>
            </a>
            <h2 class="text-right"><i class="fas fa-plus-circle f-left"></i></h2>
            <br>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-xl-3">
        <div class="card bg-c-yellow order-card">
          <div class="card-block">
            <a href="/admin-view-customer-enquiry">
              <h6 class="m-b-20">Enquiry By Customer</h6>
            </a>
            <h2 class="text-right"><i class="fas fa-check-circle f-left"></i></h2>
            <br>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-xl-3">
        <div class="card bg-c-pink order-card">
          <div class="card-block">
            <a href="/admin-view-customer-invoice">
              <h6 class="m-b-20">View Customer Invoice</h6>
            </a>
              <h2 class="text-right"><i class="fas fa-rupee-sign f-left"></i></h2>
            <br>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="margin-left:100px;" class="container">
    <h4>Prediction Summary for 1 Week</h4>
    <div style="width:75%; height:100px; margin: 0 auto;">
      <canvas id="canvas"></canvas>
    </div>
  </div>

</body>
{% endblock content %}

{%block script%}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.min.js"></script>
<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>

<!-- JSON Data -->
<script type="application/json" id="labels-data">{{ labels|safe }}</script>
<script type="application/json" id="requests-data">{{ data|safe}}</script>

<script type="text/javascript">
    // Access the JSON content
    const labelleddata = document.getElementById('labels-data').textContent;
    console.log('Labels Content:', labelleddata); // Log the raw content

    const requestsdata = document.getElementById('requests-data').textContent;
    console.log('Requests Data Content:', requestsdata); // Log the raw content

    // Parse the JSON data
    const chartlabels = JSON.parse(labelleddata);
    const chartdata = JSON.parse(requestsdata);

    console.log('Parsed Labels:', chartlabels); // Log parsed labels
    console.log('Parsed Data:', chartdata); // Log parsed data

    // Get canvas context
    let canvas = document.getElementById('canvas').getContext('2d');

    // Create the chart
    const chart = new Chart(canvas, {
        type: 'line',
        data: {
            labels: chartlabels, // Use the parsed labels
            datasets: [{
                label: 'Predicted Requests',
                data: chartdata, // Use the parsed data
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 2,
                fill: false,
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
{%endblock script%}
